apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: gpt-oss-120b
spec:
  model:
    name: openai/gpt-oss-120b
    uri: hf://openai/gpt-oss-120b
  replicas: 1
  router:
    gateway: {}
    route: {}
    scheduler:
      template:
        containers:
        - name: main
        - name: tokenizer
        imagePullSecrets:
        - name: rhai-pull-secret
  template:
    imagePullSecrets:
    - name: rhai-pull-secret
    containers:
    - name: main
      env:
      - name: PYTORCH_ALLOC_CONF
        value: expandable_segments:True
      - name: VLLM_ADDITIONAL_ARGS
        value: --tensor-parallel-size 1 --gpu-memory-utilization 0.95 --max-num-batched-tokens 1024 --max-model-len 65536
      resources:
        limits:
          cpu: '4'
          memory: 64Gi
          nvidia.com/gpu: '1'
        requests:
          cpu: '2'
          memory: 16Gi
          nvidia.com/gpu: '1'
      volumeMounts:
      - name: shm
        mountPath: /dev/shm
      - name: kserve-provision-location
        mountPath: /mnt/models
    volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
    - name: kserve-provision-location
      persistentVolumeClaim:
        claimName: model-cache-pvc
