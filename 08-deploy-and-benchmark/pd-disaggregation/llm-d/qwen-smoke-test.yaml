apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: pd-smoke-test
spec:
  model:
    name: Qwen/Qwen3-0.6B
    uri: hf://Qwen/Qwen3-0.6B
    replicas: 1
    template:
      containers:
        - name: main
          env:
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_ADDITIONAL_ARGS
              value: --tensor-parallel-size 1 --max-model-len 16000 --block-size 128 --no-disable-hybrid-kv-cache-manager --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          ports:
            - containerPort: 5600
              name: nixl
              protocol: TCP
          resources:
            limits:
              cpu: '4'
              memory: 16Gi
              nvidia.com/gpu: '1'
              rdma/ib: '1'
            requests:
              cpu: '2'
              memory: 8Gi
              nvidia.com/gpu: '1'
              rdma/ib: '1'
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
  prefill:
    replicas: 1
    template:
      containers:
        - name: main
          env:
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_ADDITIONAL_ARGS
              value: --tensor-parallel-size 1 --max-model-len 16000 --gpu-memory-utilization 0.88 --block-size 128 --no-disable-hybrid-kv-cache-manager --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
          ports:
            - containerPort: 5600
              name: nixl
              protocol: TCP
          resources:
            limits:
              cpu: '4'
              memory: 16Gi
              nvidia.com/gpu: '1'
              rdma/ib: '1'
            requests:
              cpu: '2'
              memory: 8Gi
              nvidia.com/gpu: '1'
              rdma/ib: '1'
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
  router:
    gateway: {}
    route: {}
  scheduler:
    template:
      containers:
        - name: main
          args:
            - -v=10
          resources: {}
        - name: tokenizer
          resources: {}
