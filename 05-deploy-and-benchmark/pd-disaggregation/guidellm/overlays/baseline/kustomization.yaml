apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: baseline-

resources:
  - ../../base

patches:
  - target:
      kind: Job
      name: guidellm-benchmark
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command/4
        # Change this to match your gateway service URL and namespace:
        #   OCP:  http://<gateway-svc>.openshift-ingress.svc.cluster.local/<namespace>/nemotron-30b
        #   CKS:  http://inference-gateway-istio.redhat-ods-applications.svc.cluster.local/<namespace>/nemotron-30b
        value: "http://inference-gateway-istio.redhat-ods-applications.svc.cluster.local/llmd-pd-performance/nemotron-30b"
