apiVersion: v1
kind: ServiceAccount
metadata:
  name: guidellm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-inference-access
rules:
- apiGroups: ["serving.kserve.io"]
  resources: ["llminferenceservices"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-inference-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llm-inference-access
subjects:
- kind: ServiceAccount
  name: guidellm
---
apiVersion: v1
kind: Pod
metadata:
  name: guidellm
spec:
  serviceAccountName: guidellm
  containers:
  - name: guidellm
    image: ghcr.io/vllm-project/guidellm:v0..6
    imagePullPolicy: Always
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
    command:
    - /bin/bash
    tty: true
    stdin: true

