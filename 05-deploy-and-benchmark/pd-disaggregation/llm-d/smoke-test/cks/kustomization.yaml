apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

patches:
  - target:
      kind: LLMInferenceService
      name: pd-smoke-test
    patch: |
      apiVersion: serving.kserve.io/v1alpha2
      kind: LLMInferenceService
      metadata:
        name: pd-smoke-test
      spec:
        template:
          imagePullSecrets:
            - name: rhai-pull-secret
        prefill:
          template:
            imagePullSecrets:
              - name: rhai-pull-secret
