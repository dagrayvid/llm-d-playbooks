# Minimal P/D deployment with SR-IOV VFs for RoCE:
#   - SR-IOV VFs provide hardware-isolated RDMA per pod (replaces macvlan)
#   - nv-ipam CIDRPool routes (per-interface /16 via per-node gateway)
#   - KServe KSERVE_INFER_ROCE=true (discovers all active HCAs + RoCEv2 GID index)
#   - Requires: SriovNetworkNodePolicy + SriovNetwork + CIDRPool per rail (Step 13)
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: pd-minimal
spec:
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [
        {"name": "sriov-roce-net-0", "namespace": "openshift-multus"},
        {"name": "sriov-roce-net-1", "namespace": "openshift-multus"},
        {"name": "sriov-roce-net-2", "namespace": "openshift-multus"},
        {"name": "sriov-roce-net-3", "namespace": "openshift-multus"},
        {"name": "sriov-roce-net-4", "namespace": "openshift-multus"},
        {"name": "sriov-roce-net-5", "namespace": "openshift-multus"},
        {"name": "sriov-roce-net-6", "namespace": "openshift-multus"},
        {"name": "sriov-roce-net-7", "namespace": "openshift-multus"},
        {"name": "sriov-roce-net-8", "namespace": "openshift-multus"},
        {"name": "sriov-roce-net-9", "namespace": "openshift-multus"}
      ]
  model:
    name: Qwen/Qwen3-0.6B
    uri: hf://Qwen/Qwen3-0.6B
  labels:
    benchmarks.llm-d.io/pd-role: decode
  prefill:
    annotations:
      k8s.v1.cni.cncf.io/networks: |
        [
          {"name": "sriov-roce-net-0", "namespace": "openshift-multus"},
          {"name": "sriov-roce-net-1", "namespace": "openshift-multus"},
          {"name": "sriov-roce-net-2", "namespace": "openshift-multus"},
          {"name": "sriov-roce-net-3", "namespace": "openshift-multus"},
          {"name": "sriov-roce-net-4", "namespace": "openshift-multus"},
          {"name": "sriov-roce-net-5", "namespace": "openshift-multus"},
          {"name": "sriov-roce-net-6", "namespace": "openshift-multus"},
          {"name": "sriov-roce-net-7", "namespace": "openshift-multus"},
          {"name": "sriov-roce-net-8", "namespace": "openshift-multus"},
          {"name": "sriov-roce-net-9", "namespace": "openshift-multus"}
        ]
    labels:
      benchmarks.llm-d.io/pd-role: prefill
    replicas: 1
    template:
      nodeSelector:
        kubernetes.io/hostname: dell-b200-1.bmas-001.lab.rdu2.dc.redhat.com
      containers:
      - env:
        - name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: VLLM_ADDITIONAL_ARGS
          value: --block-size 128 --kv_transfer_config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
        - name: KSERVE_INFER_ROCE
          value: 'true'
#        - name: UCX_IB_TRAFFIC_CLASS
#          value: '0'
        - name: TRITON_PTXAS_BLACKWELL_PATH
          value: /usr/local/cuda/bin/ptxas
        - name: NIXL_LOG_LEVEL
          value: debug
        - name: UCX_LOG_LEVEL
          value: debug
        #image: ghcr.io/llm-d/llm-d-cuda:v0.6.0
        image: registry.stage.redhat.io/rhaii/vllm-cuda-rhel9@sha256:d3e57d4ca13a17f4d5d1228df4fe47cfe1a9f630250a8b3d26f86d871fdb9e69
        ports:
        - containerPort: 5600
          name: nixl
          protocol: TCP
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 30
        startupProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 60
        name: main
        resources:
          limits:
            cpu: '4'
            memory: 64Gi
            nvidia.com/gpu: '1'
            openshift.io/ens40f0np0_roce: '1'
            openshift.io/ens41f0np0_roce: '1'
            openshift.io/ens38f0np0_roce: '1'
            openshift.io/ens37f0np0_roce: '1'
            openshift.io/ens32f0np0_roce: '1'
            openshift.io/ens31f0np0_roce: '1'
            openshift.io/ens36f0np0_roce: '1'
            openshift.io/ens35f0np0_roce: '1'
            openshift.io/ens42f0np0_roce: '1'
            openshift.io/ens34f0np0_roce: '1'
          requests:
            cpu: '2'
            memory: 16Gi
            nvidia.com/gpu: '1'
            openshift.io/ens40f0np0_roce: '1'
            openshift.io/ens41f0np0_roce: '1'
            openshift.io/ens38f0np0_roce: '1'
            openshift.io/ens37f0np0_roce: '1'
            openshift.io/ens32f0np0_roce: '1'
            openshift.io/ens31f0np0_roce: '1'
            openshift.io/ens36f0np0_roce: '1'
            openshift.io/ens35f0np0_roce: '1'
            openshift.io/ens42f0np0_roce: '1'
            openshift.io/ens34f0np0_roce: '1'
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
      imagePullSecrets:
      - name: rhai-pull-secret
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
  replicas: 1
  router:
    gateway: {}
    route: {}
    scheduler:
      template:
        containers:
        - name: main
          args:
          - -v=10 # 4 or 10?
          resources: {}
        - name: tokenizer
          resources: {}
        imagePullSecrets:
        - name: rhai-pull-secret
  template:
    nodeSelector:
      kubernetes.io/hostname: dell-b200-2.bmas-001.lab.rdu2.dc.redhat.com
    containers:
    - env:
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_ADDITIONAL_ARGS
        value: --block-size 128 --kv_transfer_config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
      - name: KSERVE_INFER_ROCE
        value: 'true'
#      - name: UCX_IB_TRAFFIC_CLASS
#        value: '0'
      - name: TRITON_PTXAS_BLACKWELL_PATH
        value: /usr/local/cuda/bin/ptxas
      - name: NIXL_LOG_LEVEL
        value: debug
      - name: UCX_LOG_LEVEL
        value: debug
      #image: ghcr.io/llm-d/llm-d-cuda:v0.6.0
      image: registry.stage.redhat.io/rhaii/vllm-cuda-rhel9@sha256:d3e57d4ca13a17f4d5d1228df4fe47cfe1a9f630250a8b3d26f86d871fdb9e69
      ports:
      - containerPort: 5600
        name: nixl
        protocol: TCP
      livenessProbe:
        failureThreshold: 5
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 120
        periodSeconds: 30
        timeoutSeconds: 30
      startupProbe:
        httpGet:
          path: /health
          port: 8000
          scheme: HTTPS
        initialDelaySeconds: 15
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 60
      name: main
      resources:
        limits:
          cpu: '4'
          memory: 64Gi
          nvidia.com/gpu: '1'
          openshift.io/ens40f0np0_roce: '1'
          openshift.io/ens41f0np0_roce: '1'
          openshift.io/ens38f0np0_roce: '1'
          openshift.io/ens37f0np0_roce: '1'
          openshift.io/ens32f0np0_roce: '1'
          openshift.io/ens31f0np0_roce: '1'
          openshift.io/ens36f0np0_roce: '1'
          openshift.io/ens35f0np0_roce: '1'
          openshift.io/ens42f0np0_roce: '1'
          openshift.io/ens34f0np0_roce: '1'
        requests:
          cpu: '2'
          memory: 16Gi
          nvidia.com/gpu: '1'
          openshift.io/ens40f0np0_roce: '1'
          openshift.io/ens41f0np0_roce: '1'
          openshift.io/ens38f0np0_roce: '1'
          openshift.io/ens37f0np0_roce: '1'
          openshift.io/ens32f0np0_roce: '1'
          openshift.io/ens31f0np0_roce: '1'
          openshift.io/ens36f0np0_roce: '1'
          openshift.io/ens35f0np0_roce: '1'
          openshift.io/ens42f0np0_roce: '1'
          openshift.io/ens34f0np0_roce: '1'
      volumeMounts:
      - name: shm
        mountPath: /dev/shm
    imagePullSecrets:
    - name: rhai-pull-secret
    volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
