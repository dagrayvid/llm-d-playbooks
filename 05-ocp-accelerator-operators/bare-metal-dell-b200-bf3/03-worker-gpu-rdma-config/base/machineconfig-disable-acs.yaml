apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-worker-disable-pcie-acs
  labels:
    machineconfiguration.openshift.io/role: worker
spec:
  config:
    ignition:
      version: "3.2.0"
    systemd:
      units:
      - name: disable-pcie-acs.service
        enabled: true
        contents: |
          [Unit]
          Description=Disable PCIe ACS for GPUDirect RDMA P2P
          After=multi-user.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/disable-pcie-acs.sh
          RemainAfterExit=true

          [Install]
          WantedBy=multi-user.target
    storage:
      files:
      - path: /usr/local/bin/disable-pcie-acs.sh
        mode: 0755
        overwrite: true
        contents:
          source: data:text/plain;charset=utf-8;base64,
