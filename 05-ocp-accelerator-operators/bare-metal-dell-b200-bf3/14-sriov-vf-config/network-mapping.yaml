apiVersion: v1
kind: ConfigMap
metadata:
  name: network-mapping
  namespace: llm-d-setup
  labels:
    app: roce-config
  annotations:
    description: |
      L3 routed RoCE network mapping: PF-to-rail assignments and host identity.

      Addressing formula (no VLANs — pure L3 routed fabric):
        subnet:  172.<baseOctet + railId>.<hostId>.0/24
        gateway: 172.<baseOctet + railId>.<hostId>.254   (switch routed port)
        hostIp:  172.<baseOctet + railId>.<hostId>.1     (PF address on node)

      Static routes per interface (configured via NMState NNCP):
        172.<baseOctet + railId>.0.0/16  via gateway  — rail-specific
        172.16.0.0/12                    via gateway  — ECMP fallback

      Steps that consume this ConfigMap:
        - Step 04 NNCP: assigns IPs + static routes on PFs
        - Step 13 SR-IOV: creates SriovNetworkNodePolicy + CIDRPool + SriovNetwork per rail
        - Step 15 macvlan (deprecated): creates per-node IPPools + NADs
data:
  mapping.json: |
    {
      "scheme": {
        "baseOctet": 16,
        "hostGatewayOctet": 254,
        "hostIpOctet": 1,
        "railRoutePrefix": 16,
        "ecmpRoute": "172.16.0.0/12"
      },
      "hosts": {
        "dell-b200-1.bmas-001.lab.rdu2.dc.redhat.com": 1,
        "dell-b200-2.bmas-001.lab.rdu2.dc.redhat.com": 2
      },
      "interfaces": {
        "ens40f0np0": {"railId": 0, "roceIndex": 0},
        "ens41f0np0": {"railId": 1, "roceIndex": 1},
        "ens38f0np0": {"railId": 2, "roceIndex": 2},
        "ens37f0np0": {"railId": 3, "roceIndex": 3},
        "ens32f0np0": {"railId": 4, "roceIndex": 4},
        "ens31f0np0": {"railId": 5, "roceIndex": 5},
        "ens36f0np0": {"railId": 6, "roceIndex": 6},
        "ens35f0np0": {"railId": 7, "roceIndex": 7},
        "ens42f0np0": {"railId": 8, "roceIndex": 8},
        "ens34f0np0": {"railId": 9, "roceIndex": 9}
      }
    }
