apiVersion: v1
kind: ServiceAccount
metadata:
  name: nic-resource-generator
  namespace: llm-d-setup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nic-resource-generator
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["sriovnetwork.openshift.io"]
    resources: ["sriovnetworks", "sriovibnetworks", "sriovnetworknodepolicies"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["nv-ipam.nvidia.com"]
    resources: ["cidrpools", "ippools"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nic-resource-generator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nic-resource-generator
subjects:
  - kind: ServiceAccount
    name: nic-resource-generator
    namespace: llm-d-setup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nic-resource-generator
  namespace: llm-d-setup
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: nic-resource-generator
    spec:
      serviceAccountName: nic-resource-generator
      restartPolicy: OnFailure
      containers:
        - name: generator
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - /scripts/generate-nic-resources.sh
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MTU
              value: "9000"
            - name: NETWORK_NAMESPACE
              value: "openshift-multus"
            - name: NAD_NAME_PREFIX
              value: "sriov-roce-net"
            - name: CIDRPOOL_NAMESPACE
              value: "nvidia-network-operator"
            - name: NUM_VFS
              value: "8"
            - name: NODE_SELECTOR
              value: '{"feature.node.kubernetes.io/pci-15b3.present": "true"}'
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: nic-resource-generator-script
            defaultMode: 0755
