apiVersion: v1
kind: ConfigMap
metadata:
  name: nic-policy-configurator-scripts
  namespace: nvidia-network-operator
data:
  nicclusterpolicy-template.yaml: |
    apiVersion: mellanox.com/v1alpha1
    kind: NicClusterPolicy
    metadata:
      name: nic-cluster-policy
      namespace: nvidia-network-operator
    spec:
      tolerations:
      - key: "UpdateInProgress"
        operator: "Exists"
        effect: "PreferNoSchedule"
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: Exists
      ofedDriver:
        image: doca-driver
        repository: nvcr.io/nvidia/mellanox
        version: __VERSION__
        env:
          - name: UNLOAD_STORAGE_MODULES
            value: 'true'
          # Disable VF driver restoration on pod termination. The default (true)
          # attempts to reinitialize VFs when pods die, but on BF3 SuperNICs this
          # restoration process during ungraceful termination (e.g. UCX timeout crash)
          # may itself corrupt VF RDMA state, causing persistent degradation that
          # only clears on reboot. Setting false leaves VFs as-is on pod termination.
          - name: RESTORE_DRIVER_ON_POD_TERMINATION
            value: 'false'
          - name: CREATE_IFNAMES_UDEV
            value: 'true'
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 30
        startupProbe:
          initialDelaySeconds: 10
          periodSeconds: 20
        terminationGracePeriodSeconds: 300
        upgradePolicy:
          autoUpgrade: true
          drain:
            enable: true
            force: true
            deleteEmptyDir: true
            timeoutSeconds: 300
            podSelector: ''
          maxParallelUpgrades: 2
  generate-rdma-config.py: |
    #!/usr/bin/env python3
    import json
    import sys
    import os
    import subprocess
    from collections import defaultdict

    print("\n=== RDMA Shared Device Plugin Configuration ===")

    ib_devices_file = "/tmp/ib-devices.json"

    if not os.path.exists(ib_devices_file):
        print("\nNo InfiniBand devices file found - skipping RDMA plugin config")
        sys.exit(0)

    with open(ib_devices_file, 'r') as f:
        ib_devices = json.load(f)

    if not ib_devices:
        print("\nIB devices list is empty - skipping RDMA plugin config")
        sys.exit(0)

    print(f"\nFound {len(ib_devices)} InfiniBand devices")

    devices_by_ifname_all = defaultdict(list)
    for device in ib_devices:
        pf_name = device['pfName']
        devices_by_ifname_all[pf_name].append(device)

    print(f"\nChecking carrier status consistency across nodes...")

    fully_connected_nics = []
    for if_name, devices in sorted(devices_by_ifname_all.items()):
        total_nodes = len(devices)
        nodes_with_carrier = [d for d in devices if d.get('carrier') == '1']
        carrier_count = len(nodes_with_carrier)

        if carrier_count == total_nodes:
            fully_connected_nics.extend(devices)
            print(f"  {if_name}: {carrier_count}/{total_nodes} nodes connected - INCLUDED")
        elif carrier_count > 0:
            print(f"  {if_name}: {carrier_count}/{total_nodes} nodes connected - SKIPPED (partial)")
        else:
            print(f"  {if_name}: 0/{total_nodes} nodes connected - SKIPPED (down)")

    if not fully_connected_nics:
        print("\nNo fully connected InfiniBand NICs found - skipping RDMA config")
        sys.exit(0)

    ib_devices = fully_connected_nics

    devices_by_ifname = defaultdict(list)
    for device in ib_devices:
        pf_name = device['pfName']
        devices_by_ifname[pf_name].append(device)

    if_names = sorted(devices_by_ifname.keys())
    config_list = [
        {
            "resourceName": "shared_roce",
            "rdmaHcaMax": 100,
            "selectors": {
                "vendors": ["15b3"],
                "ifNames": if_names,
            },
        }
    ]

    rdma_config_json = json.dumps({"configList": config_list}, indent=2)

    print(f"\nPatching NicClusterPolicy with RDMA shared device plugin...")

    patch = {
        "spec": {
            "rdmaSharedDevicePlugin": {
                "image": "k8s-rdma-shared-dev-plugin",
                "repository": "nvcr.io/nvidia/cloud-native",
                "version": "v1.5.2",
                "config": rdma_config_json
            }
        }
    }

    patch_json = json.dumps(patch)

    cmd = [
        "oc", "patch", "nicclusterpolicy", "nic-cluster-policy",
        "-n", "nvidia-network-operator",
        "--type=merge",
        "-p", patch_json
    ]

    result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, universal_newlines=True)

    if result.returncode == 0:
        print("NicClusterPolicy patched successfully")
        print(f"  - rdma/shared_roce: {len(if_names)} PFs in pool, rdmaHcaMax=100")
    else:
        print(f"Failed to patch NicClusterPolicy: {result.stderr}")
        sys.exit(1)
