apiVersion: v1
kind: ServiceAccount
metadata:
  name: nic-policy-configurator
  namespace: nvidia-network-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nic-policy-configurator
rules:
- apiGroups: ["operators.coreos.com"]
  resources: ["clusterserviceversions"]
  verbs: ["get", "list"]
- apiGroups: ["mellanox.com"]
  resources: ["nicclusterpolicies"]
  verbs: ["get", "list", "create", "patch", "update"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nic-policy-configurator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nic-policy-configurator
subjects:
- kind: ServiceAccount
  name: nic-policy-configurator
  namespace: nvidia-network-operator
---
apiVersion: batch/v1
kind: Job
metadata:
  name: configure-nic-policy
  namespace: nvidia-network-operator
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: nic-policy-configurator
    spec:
      serviceAccountName: nic-policy-configurator
      restartPolicy: OnFailure
      containers:
      - name: configurator
        image: registry.redhat.io/openshift4/ose-cli:latest
        command:
        - /bin/bash
        - -c
        - |
          set -e

          echo "=== NicClusterPolicy Configurator ==="
          echo ""

          # --- Phase 1: Discover OFED version and create NicClusterPolicy ---
          echo "--- Phase 1: Create NicClusterPolicy ---"

          timeout=60
          while [ $timeout -gt 0 ]; do
            CSV_NAME=$(oc get csv -n nvidia-network-operator -o name 2>/dev/null | grep nvidia-network-operator || echo "")
            if [ -n "$CSV_NAME" ]; then
              echo "Operator CSV found: $CSV_NAME"
              break
            fi
            echo "Waiting for operator CSV... ($timeout seconds left)"
            sleep 5
            timeout=$((timeout - 5))
          done

          if [ -z "$CSV_NAME" ]; then
            echo "ERROR: Could not find NVIDIA Network Operator CSV"
            exit 1
          fi

          VERSION=$(oc get $CSV_NAME -n nvidia-network-operator -o jsonpath='{.metadata.annotations.alm-examples}' | \
            python3 -c "import json,sys;examples=json.load(sys.stdin);print([item.get('spec',{}).get('ofedDriver',{}).get('version','') for item in examples if item.get('kind')=='NicClusterPolicy'][0])" 2>&1)

          if [ -z "$VERSION" ] || [ "$VERSION" = "None" ]; then
            echo "ERROR: Could not discover OFED version from operator CSV"
            exit 1
          fi

          echo "Discovered OFED version: $VERSION"

          sed "s/__VERSION__/$VERSION/" /scripts/nicclusterpolicy-template.yaml > /tmp/nicclusterpolicy.yaml
          echo "Applying NicClusterPolicy with OFED version $VERSION..."
          oc apply -f /tmp/nicclusterpolicy.yaml
          echo "NicClusterPolicy created"

          echo ""

          # --- Phase 2: RDMA shared device plugin (IB only) ---
          echo "--- Phase 2: RDMA Shared Device Plugin ---"

          if oc get configmap generated-sriov-resources -n llm-d-setup &>/dev/null; then
            echo "Found NIC discovery ConfigMap"
            if oc get configmap generated-sriov-resources -n llm-d-setup \
              -o jsonpath='{.data.ib-devices\.json}' > /tmp/ib-devices.json 2>/dev/null; then
              echo "Retrieved IB devices from discovery"
              python3 /scripts/generate-rdma-config.py
            else
              echo "No IB device data in ConfigMap - skipping RDMA plugin config"
            fi
          else
            echo "No NIC discovery ConfigMap found - skipping RDMA plugin config"
          fi

          echo ""

          # --- Phase 3: Enable NIC Configuration Operator for RoCE QoS ---
          echo "--- Phase 3: NIC Configuration Operator ---"

          # Extract operator version from CSV name (e.g., nvidia-network-operator.v26.1.0 -> v26.1.0)
          OP_VERSION=$(echo "$CSV_NAME" | grep -oP 'v\d+\.\d+\.\d+' || echo "")
          if [ -n "$OP_VERSION" ]; then
            NIC_CONF_VERSION="network-operator-${OP_VERSION}"
            echo "Enabling nicConfigurationOperator with version: $NIC_CONF_VERSION"
            oc patch nicclusterpolicy nic-cluster-policy \
              --type=merge \
              -p "{\"spec\":{\"nicConfigurationOperator\":{\"operator\":{\"image\":\"nic-configuration-operator\",\"repository\":\"nvcr.io/nvidia/mellanox\",\"version\":\"${NIC_CONF_VERSION}\"},\"configurationDaemon\":{\"image\":\"nic-configuration-operator-daemon\",\"repository\":\"nvcr.io/nvidia/mellanox\",\"version\":\"${NIC_CONF_VERSION}\"},\"logLevel\":\"info\"}}}" && \
              echo "nicConfigurationOperator enabled" || \
              echo "WARNING: Failed to enable nicConfigurationOperator"
          else
            echo "WARNING: Could not determine operator version - skipping nicConfigurationOperator"
          fi

          echo ""
          echo "=== NicClusterPolicy configuration complete ==="
        volumeMounts:
          - name: scripts
            mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: nic-policy-configurator-scripts
            defaultMode: 0755
