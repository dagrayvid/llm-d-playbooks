# Validation: 4 pods (2 per node) with RoCE macvlan + GPUDirect RDMA.
# Each pod gets 4 GPUs + 10 macvlan NICs + shared_roce.
# Pods 0,1 land on node 1; pods 2,3 land on node 2.
#
# This tests multi-pod-per-node RDMA with shared NIC resources.
---
apiVersion: v1
kind: Pod
metadata:
  name: shared-roce-macvlan-test-0
  namespace: llm-d-setup
  labels:
    test.run/shared-roce-macvlan: "true"
    test.node-group: "node-1"
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [
        {"name": "llmd-roce-net-0", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-1", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-2", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-3", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-4", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-5", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-6", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-7", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-8", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-9", "namespace": "openshift-multus"}
      ]
spec:
  restartPolicy: Never
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              test.node-group: "node-1"
          topologyKey: kubernetes.io/hostname
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              test.node-group: "node-2"
          topologyKey: kubernetes.io/hostname
  containers:
    - name: test
      image: quay.io/dagray/rdma-tools:tiny
      imagePullPolicy: Always
      command: ["sleep", "infinity"]
      env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
      resources:
        requests:
          nvidia.com/gpu: "4"
          rdma/shared_roce: "1"
        limits:
          nvidia.com/gpu: "4"
          rdma/shared_roce: "1"
      securityContext:
        privileged: true
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
