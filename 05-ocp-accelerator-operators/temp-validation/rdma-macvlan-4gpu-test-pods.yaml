# 4-pod validation: 1 GPU each, all 10 RoCE NICs shared.
#
# Simulates multi-tenant or disaggregated workloads where each pod owns a
# single GPU but shares the full RDMA fabric.
# Topology spread ensures pods land on both nodes (max 2 per node skew).
#
# Before apply:
#   - Step 14: NicClusterPolicy with shared_roce device plugin
#   - Step 15: macvlan NADs exist in openshift-multus
#
# Usage:
#   oc apply -f validation/rdma-macvlan-4gpu-test-pods.yaml
#   # Run topology discovery in each pod:
#   oc cp validation/gpu-nic-topo.sh llm-d-setup/shared-roce-4gpu-test-0:/tmp/
#   oc exec -n llm-d-setup shared-roce-4gpu-test-0 -- bash /tmp/gpu-nic-topo.sh
#   # Run ib_write_bw between pods on different nodes:
#   ./validation/run-ib-write-bw.sh 0 shared-roce-4gpu-test-0 shared-roce-4gpu-test-2
---
apiVersion: v1
kind: Pod
metadata:
  name: shared-roce-4gpu-test-0
  namespace: llm-d-setup
  labels:
    test.run/shared-roce-4gpu: "true"
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [
        {"name": "llmd-roce-net-0", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-1", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-2", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-3", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-4", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-5", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-6", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-7", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-8", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-9", "namespace": "openshift-multus"}
      ]
spec:
  restartPolicy: Never
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          test.run/shared-roce-4gpu: "true"
  containers:
    - name: test
      image: quay.io/dagray/rdma-tools:tiny
      imagePullPolicy: Always
      command: ["sleep", "infinity"]
      env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
      resources:
        requests:
          nvidia.com/gpu: "1"
          rdma/shared_roce: "1"
        limits:
          nvidia.com/gpu: "1"
          rdma/shared_roce: "1"
      securityContext:
        privileged: true
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
---
