# Validation pods for NicClusterPolicy rdmaSharedDevicePlugin with a single pooled
# resource (rdma/shared_roce, rdmaHcaMax=100) plus macvlan + NV-IPAM from step 15.
#
# Before apply:
#   - Step 14: NicClusterPolicy patched (shared_roce pool matches your RoCE PFs)
#   - Step 15: configure-macvlan-networks job completed; NADs exist in openshift-multus
#   - Align the multus annotation below with: oc get net-attach-def -n openshift-multus
#
# Scheduler places each pod on a node with 8 GPUs + rdma/shared_roce capacity.
# Pod anti-affinity tries to put the two pods on different nodes (unset second pod if you only have one 8-GPU node).
---
apiVersion: v1
kind: Pod
metadata:
  name: shared-roce-macvlan-test-0
  namespace: llm-d-setup
  labels:
    test.run/shared-roce-macvlan: "true"
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [
        {"name": "llmd-roce-net-0", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-1", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-2", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-3", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-4", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-5", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-6", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-7", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-8", "namespace": "openshift-multus"},
        {"name": "llmd-roce-net-9", "namespace": "openshift-multus"}
      ]
spec:
  restartPolicy: Never
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              test.run/shared-roce-macvlan: "true"
          topologyKey: kubernetes.io/hostname
  containers:
    - name: test
      image: quay.io/dagray/rdma-tools:tiny
      imagePullPolicy: Always
      command: ["sleep", "infinity"]
      env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
      resources:
        requests:
          nvidia.com/gpu: "1"
          rdma/shared_roce: "1"
        limits:
          nvidia.com/gpu: "1"
          rdma/shared_roce: "1"
      securityContext:
        privileged: true
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
---
