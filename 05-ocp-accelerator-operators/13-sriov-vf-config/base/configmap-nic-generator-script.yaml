apiVersion: v1
kind: ConfigMap
metadata:
  name: nic-resource-generator-script
  namespace: llm-d-setup
data:
  generate_nic_resources.py: |
    import json
    import sys
    import os
    import glob
    import subprocess
    from collections import defaultdict

    discovery_dir = os.getenv('DISCOVERY_DIR', '/discovery')
    output_dir = os.getenv('OUTPUT_DIR', '/output')
    mtu = int(os.getenv('MTU', '9000'))
    ip_range_base = os.getenv('IP_RANGE_BASE', '10.0')
    network_namespace = os.getenv('NETWORK_NAMESPACE', 'default')
    route_dest_base = os.getenv('ROUTE_DEST', '192.168.75.0/24')
    subnet_mode = os.getenv('SUBNET_MODE', 'separate').lower()

    network_mapping = {}
    mapping_file = os.getenv('NETWORK_MAPPING_FILE', '')
    if mapping_file and os.path.isfile(mapping_file):
        with open(mapping_file, 'r') as f:
            network_mapping = json.load(f)
        print(f"Loaded network mapping for {len(network_mapping)} PFs: {', '.join(sorted(network_mapping.keys()))}")
    else:
        print("No network mapping — subnets will be assigned sequentially")

    print("\n=== Processing NIC Discovery Results ===")

    all_ports = []
    node_ports = defaultdict(list)
    node_count = 0

    for discovery_file in glob.glob(f"{discovery_dir}/*-ports.json"):
        node_name = os.path.basename(discovery_file).replace('-ports.json', '')
        node_count += 1

        try:
            with open(discovery_file, 'r') as f:
                ports = json.load(f)
        except (json.JSONDecodeError, ValueError) as e:
            print(f"  WARNING: Skipping {node_name} - corrupted JSON: {e}")
            continue

        for port in ports:
            port['_node_name'] = node_name
            port['totalvfs'] = port.get('sriovTotalVfs', port.get('totalvfs', 0))
            all_ports.append(port)

    print(f"\nTotal ports discovered: {len(all_ports)} across {node_count} nodes")

    roce_ports = []
    ib_ports = []

    for port in all_ports:
        link_type = port.get('linkType', 'eth').lower()
        if link_type == 'ib':
            ib_ports.append(port)
        else:
            roce_ports.append(port)

    print(f"\nSeparated by link type:")
    print(f"  RoCE ports (for SR-IOV): {len(roce_ports)}")
    print(f"  InfiniBand ports (for NVIDIA Network Operator): {len(ib_ports)}")

    ib_export_file = f"{output_dir}/ib-devices.json"
    with open(ib_export_file, 'w') as f:
        json.dump(ib_ports, f, indent=2)

    roce_ports_with_carrier = [
        p for p in roce_ports
        if p.get('sriovCapable') and p.get('carrier') == '1'
    ]

    if network_mapping:
        before = len(roce_ports_with_carrier)
        roce_ports_with_carrier = [
            p for p in roce_ports_with_carrier
            if p['pfName'] in network_mapping
        ]
        excluded = before - len(roce_ports_with_carrier)
        if excluded:
            print(f"  Filtered to mapped PFs: {len(roce_ports_with_carrier)} kept, {excluded} excluded")

    if not roce_ports_with_carrier:
        print("\nNo RoCE ports with SR-IOV + carrier found - skipping SR-IOV config")
        with open(f"{output_dir}/.empty", 'w') as f:
            f.write("No RoCE devices with SR-IOV - IB only\n")
        sys.exit(0)

    all_ports = roce_ports_with_carrier
    node_ports = defaultdict(list)
    for port in all_ports:
        node_ports[port['_node_name']].append(port)

    print("\n=== Generating SriovNetworkNodePolicy Resources ===")

    policy_index = 0
    for port in sorted(all_ports, key=lambda x: (x.get('_node_name', ''), x.get('pfName', ''))):
        node_name = port.get('_node_name', 'unknown')
        pf_name = port['pfName']
        max_vfs = int(port.get('totalvfs', 0))
        vf_count = max_vfs
        link_type = port.get('linkType', 'eth').lower()

        link_suffix = 'ib' if link_type == 'ib' else 'roce'
        resource_name = f"{pf_name}_{link_suffix}"

        policy_lines = [
            "---",
            "apiVersion: sriovnetwork.openshift.io/v1",
            "kind: SriovNetworkNodePolicy",
            "metadata:",
            f"  name: policy-{node_name}-{pf_name}".replace('_', '-'),
            "  namespace: openshift-sriov-network-operator",
            "spec:",
            "  nodeSelector:",
            f"    kubernetes.io/hostname: \"{node_name}\"",
            f"  resourceName: {resource_name}",
            f"  priority: {99 - policy_index}",
            f"  numVfs: {vf_count}",
            "  nicSelector:",
            "    pfNames:",
            f"      - {pf_name}",
            "  deviceType: netdevice",
            "  isRdma: true",
            f"  linkType: {link_type}",
            "  excludeTopology: false",
        ]

        policy_file = f"{output_dir}/sriovnetworknodepolicy-{node_name}-{pf_name}.yaml".replace('_', '-')
        with open(policy_file, 'w') as f:
            f.write('\n'.join(policy_lines))

        policy_index += 1

    print(f"\nTotal SriovNetworkNodePolicy resources: {len(all_ports)}")

    # Generate global SriovNetwork resources (one per unique resourceName)
    print("\n=== Generating SriovNetwork Resources (one per resource type) ===")

    ports_by_resource = defaultdict(list)
    for port in all_ports:
        pf_name = port['pfName']
        link_type = port.get('linkType', 'eth').lower()
        link_suffix = 'ib' if link_type == 'ib' else 'roce'
        resource_name = f"{pf_name}_{link_suffix}"
        ports_by_resource[resource_name].append(port)

    print(f"\nFound {len(ports_by_resource)} unique resource types:")
    for resource_name, ports in sorted(ports_by_resource.items()):
        nodes = sorted(set(p.get('_node_name', 'unknown') for p in ports))
        print(f"  {resource_name}: {len(ports)} NICs across {', '.join(nodes)}")

    network_index = 0
    for resource_name in sorted(ports_by_resource.keys()):
        ports = ports_by_resource[resource_name]
        ref_port = ports[0]
        pf_name = ref_port['pfName']
        link_type = ref_port.get('linkType', 'eth').lower()

        pf_mapping = network_mapping.get(pf_name, {}) if network_mapping else {}

        if pf_mapping and 'subnet' in pf_mapping:
            ip_range = pf_mapping['subnet']
            gw = pf_mapping.get('gateway', '')
            route_dest = f"{gw}/32" if gw else ''
            source_label = "mapping"
        elif subnet_mode == 'shared':
            ip_range = f"{ip_range_base}.100.0/24"
            route_dest = route_dest_base
            source_label = "auto-shared"
        else:
            subnet_third_octet = 101 + network_index
            ip_range = f"{ip_range_base}.{subnet_third_octet}.0/24"
            route_base_parts = route_dest_base.split('/')
            route_ip_parts = route_base_parts[0].split('.')
            route_third_octet = int(route_ip_parts[2]) + network_index
            route_dest = f"{route_ip_parts[0]}.{route_ip_parts[1]}.{route_third_octet}.0/{route_base_parts[1]}"
            source_label = "auto-sequential"

        network_kind = "SriovIBNetwork" if link_type == 'ib' else "SriovNetwork"
        network_name = f"{pf_name}-{link_type}-network".replace('_', '-')
        nodes_str = ','.join(sorted(set(p.get('_node_name', 'unknown') for p in ports)))

        ipam_block = '    {\n      "type": "whereabouts",\n      "range": "' + ip_range + '"'
        if route_dest:
            ipam_block += ',\n      "routes": [\n        {\n          "dst": "' + route_dest + '"\n        }\n      ]'
        ipam_block += '\n    }'

        network_lines = [
            "---",
            "apiVersion: sriovnetwork.openshift.io/v1",
            f"kind: {network_kind}",
            "metadata:",
            f"  name: {network_name}",
            "  namespace: openshift-sriov-network-operator",
            "  annotations:",
            f"    pf: \"{pf_name}\"",
            f"    resource: \"{resource_name}\"",
            f"    nodes: \"{nodes_str}\"",
            "spec:",
            f"  resourceName: {resource_name}",
            f"  networkNamespace: {network_namespace}",
            f"  ipam: |-",
        ]
        network_lines.append(ipam_block)

        network_file = f"{output_dir}/sriov{link_type}network-{pf_name}.yaml".replace('_', '-')
        with open(network_file, 'w') as f:
            f.write('\n'.join(network_lines))

        print(f"  {network_name} -> {ip_range} ({source_label})")
        network_index += 1

    print(f"\nTotal SriovNetwork resources: {len(ports_by_resource)}")
    print("=== SR-IOV Resource generation complete! ===")

  generate-nic-resources.sh: |
    #!/bin/bash
    set -euo pipefail

    echo "=== NIC Resource Generator ==="

    DISCOVERY_DIR="/tmp/discovery"
    OUTPUT_DIR="/tmp/output"
    mkdir -p "$DISCOVERY_DIR" "$OUTPUT_DIR"

    MTU=${MTU:-9000}
    IP_RANGE_BASE=${IP_RANGE_BASE:-"10.0"}
    NETWORK_NAMESPACE=${NETWORK_NAMESPACE:-"default"}
    ROUTE_DEST=${ROUTE_DEST:-"192.168.75.0/24"}
    SUBNET_MODE=${SUBNET_MODE:-"separate"}

    NS="${NAMESPACE:-llm-d-setup}"

    MAPPING_FILE="${DISCOVERY_DIR}/network-mapping.json"
    if oc get configmap network-mapping -n "$NS" &>/dev/null; then
      echo "Found network-mapping ConfigMap — using explicit PF→subnet mapping"
      oc get configmap network-mapping -n "$NS" -o jsonpath='{.data.mapping\.json}' > "$MAPPING_FILE"
      export NETWORK_MAPPING_FILE="$MAPPING_FILE"
    else
      echo "No network-mapping ConfigMap found — using auto-discovery mode"
    fi

    echo "Reading discovery ConfigMaps..."

    CM_NAMES=$(oc get configmap -n "$NS" -l app=nic-discovery -o jsonpath='{.items[*].metadata.name}')

    if [ -z "$CM_NAMES" ]; then
      echo "Error: No nic-discovery ConfigMaps found in namespace $NS"
      echo "Did step 12 (NIC Discovery) run successfully?"
      exit 1
    fi

    for cm in $CM_NAMES; do
      node="${cm#nic-discovery-}"
      echo "Reading ConfigMap: $cm (node: $node)"

      DISCOVERY_FILE="${DISCOVERY_DIR}/${node}-ports.json"
      oc get configmap "$cm" -n "$NS" -o jsonpath='{.data.ports\.json}' > "$DISCOVERY_FILE"
    done

    export DISCOVERY_DIR OUTPUT_DIR MTU IP_RANGE_BASE NETWORK_NAMESPACE ROUTE_DEST SUBNET_MODE
    python3 /scripts/generate_nic_resources.py

    echo ""
    echo "=== Exporting IB Devices for NVIDIA Network Operator ==="

    if [ -f "$OUTPUT_DIR/ib-devices.json" ]; then
      oc create configmap generated-sriov-resources \
        --from-file=ib-devices.json="$OUTPUT_DIR/ib-devices.json" \
        -n llm-d-setup \
        --dry-run=client -o yaml | oc apply -f -
    fi

    echo ""
    echo "=== Applying generated resources ==="

    for yaml_file in "$OUTPUT_DIR"/*.yaml; do
      if [ -f "$yaml_file" ]; then
        oc apply -f "$yaml_file" && echo "Applied: $(basename "$yaml_file")"
      fi
    done

    echo ""
    echo "=== Cleanup Discovery Resources ==="
    oc delete daemonset nic-port-discovery -n llm-d-setup --ignore-not-found=true
