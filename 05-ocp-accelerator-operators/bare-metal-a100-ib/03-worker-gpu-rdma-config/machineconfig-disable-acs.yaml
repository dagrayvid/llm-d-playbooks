apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-a100-gpu-disable-acs-p2p-redirect
  labels:
    machineconfiguration.openshift.io/role: a100-gpu
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /usr/local/bin/disable-acs-p2p-redirect.sh
          # Clears PCIe ACS P2P Redirect (bits 2+3) on PCI bridges (class 0x0604).
          # Only targets ReqRedir and CmpltRedir — the two bits that redirect P2P
          # transactions upstream through the root complex instead of allowing direct
          # device-to-device transfers within the PCIe switch. Preserves SrcValid,
          # UpstreamFwd, and other ACS bits. Required for GPUDirect RDMA with
          # Broadcom PEX880xx switches.
          contents:
            source: data:text/plain;charset=utf-8;base64,
          filesystem: root
          mode: 0755
    systemd:
      units:
        - name: disable-acs-p2p-redirect.service
          enabled: true
          contents: |
            [Unit]
            Description=Disable PCIe ACS P2P Redirect for GPUDirect RDMA
            After=network-online.target
            Before=nvidia-driver.service

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/disable-acs-p2p-redirect.sh
            RemainAfterExit=yes

            [Install]
            WantedBy=multi-user.target
