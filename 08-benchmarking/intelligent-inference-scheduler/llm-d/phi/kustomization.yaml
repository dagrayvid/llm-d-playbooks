apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

patches:
  - target:
      kind: LLMInferenceService
      name: model
    patch: |-
      - op: replace
        path: /metadata/name
        value: phi
      - op: replace
        path: /metadata/annotations/openshift.io~1display-name
        value: phi
      - op: replace
        path: /spec/model/uri
        value: "hf://microsoft/Phi-3.5-mini-instruct"
      - op: replace
        path: /spec/model/name
        value: "microsoft/Phi-3.5-mini-instruct"
