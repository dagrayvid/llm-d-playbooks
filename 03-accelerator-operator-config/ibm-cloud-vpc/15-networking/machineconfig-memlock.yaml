apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 100-gpu-h100-crio-memlock
  labels:
    # Must match the MachineConfigPool name (gpu-h100)
    machineconfiguration.openshift.io/role: gpu-h100
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /etc/crio/crio.conf.d/99-memlock.conf
          mode: 0644
          overwrite: true
          contents:
            inline: |
              [crio.runtime]
              default_ulimits = [
                "memlock=-1:-1"
              ]
