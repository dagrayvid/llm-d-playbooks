# ipvlan L2 NetworkAttachmentDefinitions — one per rail (GPU-NIC pair).
#
# Each NAD creates an ipvlan sub-interface on the physical function (PF)
# and assigns an IP via whereabouts IPAM. The PF stays on the host;
# multiple pods share the same PF.
#
# These NADs assume L2 switching (both nodes on the same VLAN per rail).
# For L3 routed switching (per-node subnets), see the L3 section in
# the README.
#
# Change the "master" field to match your NIC interface names.
# Change the IP ranges to match your network addressing.
#
# Note: nv-ipam could be used instead of whereabouts for IPAM.
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ipvlan-rail0
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "ipvlan-rail0",
      "type": "ipvlan",
      "master": "ens40f0np0",
      "mode": "l2",
      "ipam": {
        "type": "whereabouts",
        "range": "172.16.0.0/24",
        "range_start": "172.16.0.10",
        "range_end": "172.16.0.250"
      }
    }
---
