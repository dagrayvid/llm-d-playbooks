apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfigPool
metadata:
  name: gpu-worker
spec:
  machineConfigSelector:
    matchExpressions:
      - key: machineconfiguration.openshift.io/role
        operator: In
        values:
          - worker
          - gpu-worker
  nodeSelector:
    matchLabels:
      # Label your GPU worker nodes: oc label node <name> node-role.kubernetes.io/gpu-worker=""
      node-role.kubernetes.io/gpu-worker: ""
