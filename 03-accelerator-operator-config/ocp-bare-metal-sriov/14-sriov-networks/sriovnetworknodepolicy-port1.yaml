apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetworkNodePolicy
metadata:
  name: policy-roce-port1
  namespace: openshift-sriov-network-operator
spec:
  deviceType: netdevice
  isRdma: true
  mtu: 9000
  nicSelector:
    # Change pfNames to match your NIC interface name for port 1.
    # Run: ip link | grep eno12 (or check lspci -v for the Mellanox device)
    pfNames:
      - eno12399np0
    vendor: "15b3"
  nodeSelector:
    # Change to match your GPU worker node role label
    node-role.kubernetes.io/gpu-worker: ""
  numVfs: 8
  priority: 90
  resourceName: sriov_vf_port1
